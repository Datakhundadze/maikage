<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Storage CDN hosting catalog mockups, sport photos, and user-uploaded
         content. Every catalog/detail page fetches multiple assets from here,
         so warming the TCP+TLS connection before SPA mounts cuts first-image
         latency. -->
    <link rel="preconnect" href="https://ykoseamefoabptuijsza.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://ykoseamefoabptuijsza.supabase.co" />
    <!-- Analytics: GTM + gtag.js both load from googletagmanager.com.
         dns-prefetch warms the lookup; full preconnect would also do
         TCP+TLS handshake but for an async script that's not on the
         critical path the DNS warmup alone is the better trade. -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <!-- Preload the default catalog t-shirt mockup (16 KB WebP) so the
         CatalogDesignCard compositor finds it in cache the moment it
         mounts. Without this, the canvas-side `new Image()` fetch runs
         in serial with everything else and customers see the design
         print appear before the t-shirt body — same byte budget, just
         primed earlier. Cross-origin not needed (same origin) but
         crossorigin attribute would not hurt; omitted because it's an
         image preload, which doesn't require CORS. -->
    <link
      rel="preload"
      as="image"
      href="/products/tshirt/gildan-white-front.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <!-- Google Fonts: loaded non-blocking via the well-supported
         media-print swap trick. The browser fetches the stylesheet at
         high priority but, because `media="print"` matches no current
         medium, it doesn't gate the initial paint. The inline onload
         flips media to `all` once the CSS lands, applying the fonts
         without blocking render. The <noscript> fallback restores the
         classic synchronous load for the small set of crawlers / users
         without JS.
         Only the SimplePage editor's font picker actually consumes
         these — the rest of the UI uses the Tailwind system-font stack
         (Georgian glyphs hit each platform's bundled Noto Sans
         Georgian / Sylfaen via system fallback). Deferring the load
         therefore doesn't change the visible UI for non-editor
         visitors. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=BPG+Arial&family=Dancing+Script:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Noto+Sans+Georgian:wght@400;700&family=Noto+Serif+Georgian:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@400;700&family=Pacifico&family=Playfair+Display:wght@400;700&family=Raleway:wght@400;700&family=Roboto:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=BPG+Arial&family=Dancing+Script:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Noto+Sans+Georgian:wght@400;700&family=Noto+Serif+Georgian:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@400;700&family=Pacifico&family=Playfair+Display:wght@400;700&family=Raleway:wght@400;700&family=Roboto:wght@400;700&display=swap"
      />
    </noscript>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    <!-- Render-blocking JS audit (Phase 3):

           real gtm.js <script> with async=true so the heavy fetch is
           non-blocking. Keeping the inline tag in <head> per GTM's
           install guide for event-timing accuracy.
         - gtag.js: already loaded with async ✓.
         - /src/main.tsx: type=module so it's deferred by spec ✓.
         No further script-level defer / async work needed — Phase 2's
         route splitting already addressed the JS payload itself. -->

    })(window,document,'script','dataLayer','GTM-PG9TKLLM');</script>
    <!-- End Google Tag Manager -->
