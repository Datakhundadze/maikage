[[redirects]]
  from = "/sitemap.xml"
  to = "https://ykoseamefoabptuijsza.supabase.co/functions/v1/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/products/*"
  to = "/products/:splat"
  status = 200

[[redirects]]
  from = "/*.png"
  to = "/:splat.png"
  status = 200

[[redirects]]
  from = "/*.jpg"
  to = "/:splat.jpg"
  status = 200

[[redirects]]
  from = "/*.jpeg"
  to = "/:splat.jpeg"
  status = 200

[[redirects]]
  from = "/*.webp"
  to = "/:splat.webp"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
